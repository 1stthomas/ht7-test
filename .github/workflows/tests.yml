name: "build"
run-name: Extended lint and tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches-ignore: [ master, develop ]
# on:
#   push:
#     branches: 
#       - master
#       - develop
#     paths:
#       - '**'
#       - '!.build/**'
#   pull_request:
#     branches: 
#       - master
#       - develop
#     types:
#       - opened

jobs:
  Action-Linting:
    uses: 1stthomas/ht7-github-actions/.github/workflows/lint-basics.yml@master
    with:
      xml_path: "./src"
      xml_file_endings: ".xml"

  PHPStan:
    needs: [Action-Linting]
    uses: 1stthomas/ht7-github-actions/.github/workflows/phpstan.yml@master
    with:
      level: "max"
      path: "src/ tests/"
      php_version: 8.4

  PHP-CS-Fixer:
    needs: [Action-Linting]
    uses: 1stthomas/ht7-github-actions/.github/workflows/php-cs-fixer.yml@master

  PHPUnit:
    name: "Unit Tests - PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }}"
    continue-on-error: ${{ matrix.php-version == '8.4' }}
    env:
      CODE_COVERAGE: none
      LC_ALL: en_US.UTF-8
      PHP_EXTENSIONS: mbstring, xml, ctype, iconv
    needs: [PHPStan, PHP-CS-Fixer]
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - "locked"
        operating-system:
          - "ubuntu-22.04"
        composer:
          - "composer:v2"
        composer-command:
          - "composer install --no-interaction --no-progress --no-suggest"
        include:
          - composer-command: "composer update --prefer-lowest --no-interaction --no-progress --no-suggest"
            dependencies: "lowest"
            operating-system: "ubuntu-22.04"
            php-version: 8.4
          - composer-command: "composer update --no-interaction --no-progress --no-suggest"
            dependencies: "highest"
            operating-system: "ubuntu-22.04"
            php-version: 8.4

    steps:
      - name: Enable code coverage and test reporting
        if: matrix.php-version == '8.4' && startsWith(matrix.operating-system, 'ubuntu') && matrix.dependencies == 'locked'
        run: printf 'CODE_COVERAGE=pcov\n' >> "$GITHUB_ENV"
      - name: "Checkout ${{ github.repository }}"
        uses: actions/checkout@v4
      - name: "Install PHP ${{ matrix.php-version }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: ${{ env.CODE_COVERAGE }}
          tools: ${{ matrix.composer }}
      - name: Install dependencies
        run: |
          ${{ matrix.composer-command }}
      - name: Perform unit tests"
        if: env.CODE_COVERAGE == 'none'
        run: composer test-unit
      - name: Perform unit tests with test report
        if: env.CODE_COVERAGE != 'none'
        run: ./vendor/bin/phpunit --configuration ./phpunit.xml --log-junit ./.artifacts/phpunit-report.xml
      - name: Upload artifact
        if: always() && env.CODE_COVERAGE != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-report
          path: .artifacts/phpunit-report.xml
          retention-days: 1
      # - name: "Perform unit tests with coverage"
      #   if: env.CODE_COVERAGE != 'none'
      #   run: |
      #     php ./vendor/bin/phpunit --configuration ./tests/phpunit-cc.xml --coverage-clover=clover.xml --testsuite Unit
      # - name: Make code coverage badge
      #   if: env.CODE_COVERAGE != 'none'
      #   uses: timkrase/phpunit-coverage-badge@v1.2.1
      #   with:
      #     coverage_badge_path: .build/images/badge-coverage.svg
      #     push_badge: true
      #     repo_token: ${{ secrets.GITHUB_TOKEN }}
      # - name: Git push to image-data branch
      #   if: env.CODE_COVERAGE != 'none' && github.event_name == 'pull_request'
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     publish_dir: ./output
      #     publish_branch: image-data
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     user_name: 'github-actions[bot]'
      #     user_email: 'github-actions[bot]@users.noreply.github.com'

  test-report:
    needs: [PHPUnit]
    uses: 1stthomas/ht7-github-actions/.github/workflows/php-test-report.yml@master
    with:
      artifact_name: "phpunit-report"
      artifact_path: ".artifacts/"
      report_name: "phpunit-report.xml"
  
  Security-Composer:
    needs: [PHPUnit]
    uses: 1stthomas/ht7-github-actions/.github/workflows/security-composer.yml@master
